# ============================================================================
# CI/CD - rb-palestra-holding
# Push em main -> build sanity check no runner do GHA -> SSH na VPS -> rebuild.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.html || { echo "ERRO: dist/index.html nao foi gerado"; exit 1; }
          echo "Build OK. Conteudo de dist/:"
          ls -la dist/

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (sanity check)
        run: docker build -f Dockerfile -t palestra-holding-web:ci .

  deploy:
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/palestra-holding
            # git reset --hard em vez de git pull para garantir que a VPS sempre
            # fica IDENTICA ao main remoto, mesmo se houver edicoes locais.
            git fetch origin main
            git reset --hard origin/main
            cd /opt/apps/palestra-holding
            docker compose build --no-cache web
            docker compose up -d --force-recreate web
            docker image prune -f
