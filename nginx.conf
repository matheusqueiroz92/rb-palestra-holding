# ============================================================================
# nginx.conf - rb-palestra-holding
# Serve o dist/ do Vite como SPA: requests para rotas client-side caem no
# index.html (fallback). Cache agressivo para assets com hash, no-cache para
# index.html para sempre buscar a versao mais recente.
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Seguranca basica
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA fallback: qualquer rota desconhecida serve index.html.
    # Mesmo em landing page e boa pratica (caso adicione roteamento depois).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (Vite gera assets-[hash].js): cache imutavel por 1 ano.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|woff|woff2|ttf|eot|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html nunca pode ficar cacheado: sempre busca a versao nova.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # Gzip on
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 404 padrao
    error_page 404 /index.html;
}
